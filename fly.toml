# Fly.io — recomendado: el volumen persiste la base de datos. OJO: no hay plan gratis para cuentas nuevas, solo $1 de prueba por 7 días (docs Fly.io, 2026-11-04); después hace falta tarjeta y se paga por uso.
app = "sellos-nymela-home"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "sellos_data"
  destination = "/app/data"

[env]
  PORT = "3000"
